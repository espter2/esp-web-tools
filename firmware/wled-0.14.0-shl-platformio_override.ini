[platformio]
default_envs = shl_stock_wled

[env:shl_stock_wled]
extends = env:esp32dev
lib_deps =
  https://github.com/lorol/LITTLEFS.git
  https://github.com/pbolduc/AsyncTCP.git#38b8475
  fastled/FastLED @ 3.6.0
  IRremoteESP8266 @ 2.8.2
  makuna/NeoPixelBus @ 2.7.5
  https://github.com/Aircoookie/ESPAsyncWebServer.git#b9349dc7b5635fd7a9abce16bf49ad6a8aae817d
build_flags =
  ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=SHL_Stock_0.14.0
  -D DATA_PINS=15,16,17,18
  -D PIXEL_COUNTS=200,200,200,200
  -D DEFAULT_LED_TYPE=TYPE_SK6812_RGBW
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_RGB
  -D DEFAULT_LED_AWMODE=RGBW_MODE_AUTO_ACCURATE
  -D DEFAULT_LED_MILLIAMPS=0
